# Evidence passage linking (task family #5 in docs/PLAN.md §7).
# A descriptive claim with no number to recompute: support rests entirely on
# whether an exact passage asserts it. Gold outcome: supported via a passage.
task_id: synthetic_data_passage
family: evidence_passage
title: "The model is trained only on synthetic data"
description: >
  A qualitative claim whose only evidence channel is the paper text. One passage
  asserts it directly; a distractor passage is about an unrelated topic, so the
  linker must select the correct passage rather than any keyword match.

claim:
  claim_id: c_synthetic_data
  claim_text: "The model is trained only on synthetic data."
  claim_type: descriptive_claim
  source_document_id: paper_training
  source_passage: p_data

artifacts:
  bundle_id: bundle_synthetic_data_passage
  task_id: synthetic_data_passage
  papers:
    - artifact_id: paper_training
      title: "Training setup"
      passages:
        - passage_id: p_data
          section: "Training data"
          text: >
            All experiments use synthetic data generated by our pipeline; no real
            corpora were used at any stage of training.
        - passage_id: p_hardware
          section: "Compute"
          text: "Training ran on a single CPU node; no GPU was required."
  metadata:
    license: synthetic
    provenance: hand-authored synthetic fixture

expected:
  support_label: supported
  reproduction_status: not_applicable
  failure_mode: none
  claim:
    normalized_claim: "training data = synthetic only"
    entities: [model]
    conditions: ["synthetic data only"]
  evidence:
    - kind: passage
      target_id: p_data
      quote: "All experiments use synthetic data generated by our pipeline; no real corpora were used"

notes: >
  There is nothing to recompute or execute; the verdict depends only on the
  passage link, which is why this task exercises the evidence channel in
  isolation.
